# Ozoda Mebel - Nginx konfiguratsiya namunasi
# Fayl joylashuvi: /etc/nginx/sites-available/ozodamebel
# 
# O'rnatish:
# 1. sudo nano /etc/nginx/sites-available/ozodamebel
# 2. Bu faylni ko'chiring va domeningizni o'zgartiring
# 3. sudo ln -s /etc/nginx/sites-available/ozodamebel /etc/nginx/sites-enabled/
# 4. sudo nginx -t
# 5. sudo systemctl reload nginx

# HTTP server (SSL dan oldin)
server {
    listen 80;
    listen [::]:80;
    
    # O'ZGARTIRING: Sizning domeningiz
    server_name your-domain.com www.your-domain.com;
    
    # Backend API
    location /api {
        proxy_pass http://localhost:3008;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout sozlamalari
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Body size limit
        client_max_body_size 10M;
    }
    
    # Socket.IO uchun
    location /socket.io {
        proxy_pass http://localhost:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout
        proxy_read_timeout 86400;
    }
    
    # Health check
    location /health {
        proxy_pass http://localhost:3008/health;
        access_log off;
    }
    
    # Frontend (React/Vue/Angular)
    location / {
        # O'ZGARTIRING: Frontend build papkangiz
        root /var/www/ozodamebel/desktop/dist;
        try_files $uri $uri/ /index.html;
        
        # Cache sozlamalari statik fayllar uchun
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # HTML fayllar uchun cache yo'q
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }
    
    # Gzip siqish
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}

